services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mariposa
      POSTGRES_PASSWORD: mariposa_dev
      POSTGRES_DB: mariposa
    ports: ["5432:5432"]
    volumes: [mariposa_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mariposa"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    profiles: ["scale"]
    ports: ["6379:6379"]
volumes:
  mariposa_pg:
